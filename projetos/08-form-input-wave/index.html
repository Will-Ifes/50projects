<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>08 · Form Input Wave | 50 Projetos</title>
      <link rel="stylesheet" href="../../comum/vitrine.css">
</head>
  <body>
    <nav class="vitrine-nav" aria-label="Vitrine"><a class="vitrine-voltar" href="../../">← Vitrine</a></nav>
    <main class="vitrine-main">
    <div class="container">
      <h1>Please Login</h1>
      <form>
        <div class="form-control">
            <input type="text" id="email" autocomplete="email" required>
            <label for="email">Email</label>
        </div>

        <div class="form-control">
            <input type="password" id="password" autocomplete="current-password" required>
            <label for="password">Password</label>
        </div>

        <button class="btn">Login</button>

        <p class="text">Don't have an account <a href="#">Register</a></p>

      </form>
    </div>

    <script src="script.js"></script>
      </main>
</body>
</html>
