<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="style.css" />
        <title>31 · Password Generator | 50 Projetos</title>
        <link rel="stylesheet" href="../../comum/vitrine.css">
</head>
    <body>
    <nav class="vitrine-nav" aria-label="Vitrine"><a class="vitrine-voltar" href="../../">← Vitrine</a></nav>
    <main class="vitrine-main">
    <h1 class="vitrine-sr">Password Generator</h1>
        <div class="container">
            <h2>Password Generator</h2>
            <div class="result-container">
                <span id="result"></span>
                <button class="btn" id="clipboard" aria-label="Copiar senha">
                    <i class="far fa-clipboard"></i>
                </button>
            </div>
            <div class="forca">
                <span class="forca-barra" aria-hidden="true"><span id="forca-preenchimento"></span></span>
                <span id="forca-texto">Strength: -</span>
            </div>
            <p id="copia-status" class="copia-status" role="status" aria-live="polite"></p>

            <div class="settings">
                <div class="setting">
                    <label for="length">Password Length</label>
                    <input type="number" id="length" min="4" max="64" value="20">
                </div>
                <div class="setting">
                    <label for="uppercase">Include uppercase letters</label>
                    <input type="checkbox" id="uppercase" checked>
                </div>
                <div class="setting">
                    <label for="lowercase">Include lowercase letters</label>
                    <input type="checkbox" id="lowercase" checked>
                </div>
                <div class="setting">
                <label for="numbers">Include numbers</label>
                    <input type="checkbox" id="numbers" checked>
                </div>
                <div class="setting">
                    <label for="symbols">Include symbols</label>
                    <input type="checkbox" id="symbols" checked>
                </div>
                <button class="btn btn-large" id="generate">Generate Password</button>
            </div>
        </div>
        <script src="script.js"></script>
        </main>
</body>
</html>
